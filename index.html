<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="css/style.css">
  <title>Aditya Dewa Nugraha - Portfolio</title>
</head>

<body>
  <div class="custom-cursor"></div>

  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <div class="logo" data-aos="zoom-in" data-aos-duration="1500">
        <span>&lt; </span>Dewa<span>Dev./ &gt;</span>
      </div>
      <div class="links">
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="100"><a href="#home">Home</a>
        </div>
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200"><a href="#about">About</a>
        </div>
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="300"><a
            href="#myjourney">Journey</a></div>
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="400"><a href="#skill">Skills</a>
        </div>
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="500"><a
            href="#projects">Projects</a></div>
        <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="600"><a
            href="#contact">Contact</a></div>
      </div>
    </div>

    <button id="audio-control-mobile" class="audio-btn-mobile">
      <i class="fa-solid fa-music"></i>
    </button>
    <i class="fa-solid fa-bars-staggered hamburg" onclick="hamburg()"></i>
  </nav>

  <!-- Dropdown Menu Mobile -->
  <div class="dropdown">
    <div class="links">
      <a href="#home" onclick="navigateMenu(event, '#home')">Home</a>
      <a href="#about" onclick="navigateMenu(event, '#about')">About</a>
      <a href="#myjourney" onclick="navigateMenu(event, '#myjourney')">Journey</a>
      <a href="#skill" onclick="navigateMenu(event, '#skill')">Skills</a>
      <a href="#projects" onclick="navigateMenu(event, '#projects')">Projects</a>
      <a href="#contact" onclick="navigateMenu(event, '#contact')">Contact</a>
      <i class="fa-solid fa-xmark cancel" onclick="cancel()"></i>
    </div>
  </div>

  <!-- Placeholder Section (Otomatis diganti isi file dari folder sections/) -->
  <div data-include="sections/home.html"></div>
  <div data-include="sections/about.html"></div>
  <div data-include="sections/journey.html"></div>
  <div data-include="sections/skills.html"></div>
  <div data-include="sections/projects.html"></div>
  <div data-include="sections/contact.html"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-logo" data-aos="fade-up" data-aos-duration="1000">
        <span>&lt; </span>Dewa<span>Dev./ &gt;</span>
      </div>
      <p data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
        Designed &amp; Built with <i class="fa-solid fa-bolt"></i> by Aditya Dewa Nugraha
      </p>
      <p class="copyright" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">
        &copy; 2026 All Rights Reserved.
      </p>
    </div>
  </footer>

  <!-- Background Audio -->
  <audio id="bg-music" loop>
    <source src="audio/Bgm.mp3" type="audio/mpeg">
  </audio>

  <button id="audio-control-pc" class="audio-btn-pc">
    <i class="fa-solid fa-music"></i>
  </button>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    // 1. Muat semua section secara paralel, lalu jalankan AOS & script.js
    async function loadSections() {
      const placeholders = document.querySelectorAll('[data-include]');

      await Promise.all(
        Array.from(placeholders).map(async (el) => {
          const file = el.getAttribute('data-include');
          try {
            const response = await fetch(file);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            el.outerHTML = await response.text();
          } catch (err) {
            console.error(`Gagal memuat ${file}:`, err);
          }
        })
      );

      // Inisialisasi AOS setelah seluruh section masuk ke DOM
      AOS.init({
        offset: 0,
        once: true,
        duration: 1000
      });

      // Muat script.js setelah elemen #home (.typewriter-text) sudah tersedia
      const mainScript = document.createElement('script');
      mainScript.src = './js/script.js';
      mainScript.onload = () => {
        // Jaga-jaga jika script.js memakai window.onload untuk memulai typewriter
        if (document.readyState === 'complete' && typeof window.onload === 'function') {
          window.onload();
        }
      };
      document.body.appendChild(mainScript);

      // Jika user membuka URL langsung dengan hash (misal /#projects), scroll ke target
      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }
    }

    loadSections();

    // 2. Custom Cursor dengan Event Delegation (otomatis mendukung elemen hasil fetch)
    const customCursor = document.querySelector('.custom-cursor');
    const interactiveSelector = 'a, button, .hamburg, .cancel';

    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top = e.clientY + 'px';
    });

    document.addEventListener('mouseover', (e) => {
      if (e.target.closest(interactiveSelector)) {
        customCursor.classList.add('hovered');
      }
    });

    document.addEventListener('mouseout', (e) => {
      if (e.target.closest(interactiveSelector)) {
        customCursor.classList.remove('hovered');
      }
    });
  </script>
</body>

</html>
